services:
  # 1. The Database
  neo4j:
    image: neo4j:5-community
    container_name: clinical_graph_db
    ports:
      - "7474:7474" # Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - ./neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 2. The Cache
  redis:
    image: redis:7-alpine
    container_name: clinical_graph_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. The FastAPI Backend
  api:
    build: .
    container_name: graphrag-api
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Use container names instead of localhost
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - REDIS_URL=redis://redis:6379
      # Tell the container how to reach the Ollama daemon running on your Mac host
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    restart: unless-stopped